services:
  database:
    container_name: skate-map-db
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-skate_map}
      PGDATA: /var/lib/postgresql/data
    ports: 
      - "5432:5432"
    volumes:
      - skate_map_data:/var/lib/postgresql/data
    networks:
      - skate-map-network

volumes:
  skate_map_data:
    driver: local

networks:
  skate-map-network:
    driver: bridge