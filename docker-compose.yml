services:
  db:
    container_name: skate-map-db
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-skate_map}
      PGDATA: /var/lib/postgresql/data
    ports: 
      - "5432:5432"

    volumes:
      - skate_map_data:/var/lib/postgresql/data

volumes:
  skate_map_data:
    driver: local
