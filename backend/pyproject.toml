[project]
name = "skate-map"
version = "0.1.0"
readme = "README.md"
description = "FastAPi backend for skate-map skate spot discovery platform"
requires-python = ">= 3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlmodel>=0.0.16",
    "geoalchemy2>=0.14.0",
    "psycopg2-binary>=2.9.9",
    "starlette-admin>=0.13.0",
    "pydantic-settings>=2.2.1",
    "alembic>=1.13.1",
    # fastapi-users with both SQLModel/SQLAlchemy and JWT support built-in
    "fastapi-users[sqlalchemy,jwt]>=13.0.0", 
    # Cryptography provider required by passlib/fastapi-users for password hashing
    "bcrypt>=4.1.0",

]

[tool-uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.22.0",
    "httpx>=0.28.0",
    "pytest-cov>=5.3.1",
    "pytest-mock>=3.11.1",
]